<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Treinos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="conteudo">

        <div class="conteudo-titulo">
            <h2 class="titulo-principal">Gerador de Treinos</h2>
            <h3 class="titulo-secundario">
                Gere um treino personalizado de forma aleatória
            </h3>
        </div>

        <div class="conteudo-treino">
            <label for="treino">Treino gerado</label>

            <div id="campo-treino">
                <p>Seu treino aparecerá aqui...</p>
            </div>

            <button id="gerar-treino">
                Gerar treino
            </button>
        </div>

        <div class="parametro">

            <h3 class="parametro-titulo">
                Personalize seu treino!
            </h3>

            <div class="parametro-coluna">

                <div class="parametro-opcao">
                    <h4>Objetivo</h4>

                    <select id="objetivo">
                        <option value="hipertrofia">Hipertrofia</option>
                        <option value="forca">Força</option>
                        <option value="condicionamento">Condicionamento</option>
                    </select>
                </div>

                <div class="parametro-opcao">
                    <h4>Nível</h4>

                    <select id="nivel">
                        <option value="iniciante">Iniciante</option>
                        <option value="intermediario">Intermediário</option>
                        <option value="avancado">Avançado</option>
                    </select>
                </div>

                <div class="parametro-opcao">
                    <h4>Duração</h4>

                    <select id="duracao">
                        <option value="30">30 minutos</option>
                        <option value="45">45 minutos</option>
                        <option value="60">60 minutos</option>
                        <option value="90">90 minutos</option>
                    </select>
                </div>

                <div class="parametro-opcao">
                    <h4>Local</h4>

                    <select id="local">
                        <option value="academia">Academia</option>
                        <option value="casa">Casa</option>
                        <option value="peso-corporal">Peso corporal</option>
                    </select>
                </div>

            </div>

        </div>

    </section>

    <script src="main.js"></script>

</body>
</html>
